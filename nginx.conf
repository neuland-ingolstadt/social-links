server {
	listen 80;
	listen [::]:80;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;

	# Always revalidate HTML so deploys are visible immediately.
	location = / {
		add_header Cache-Control "no-cache" always;
		try_files /index.html =404;
	}

	location = /index.html {
		add_header Cache-Control "no-cache" always;
	}

	# Fingerprinted via ?v= in index.html — safe to cache long at the edge.
	location ~* \.(?:css|js|woff2)$ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location / {
		try_files $uri =404;
	}
}
